<style>

<body>
<div id="app"></div>
<script>

let mem = {};

// ---------- API ----------

  const btn = h('button', { class: 'primary', type: 'submit' }, 'Sign in');

    logoImg('', 72), h('h1', {}, brand.name), h('div', { class: 'tag' }, brand.tagline || 'Sign in to continue'),
    h('label', {}, 'Login name or email'), user, h('label', {}, 'Password'), pass, err, h('div', { style: 'margin-top:1rem' }, btn));
  $app.replaceChildren(form); user.focus();
}

// ---------- shell ----------
let tabs = [], current = null, view = null, prefill = null;

  if (!token) return renderLogin();

  if (can('customers.view')) { let n = 0; try { const d = await api('GET', '/customers/due'); n = d.counts.due + d.counts.at_risk; } catch { /* badge is optional */ } tabs.push(['due', n ? `Follow-ups (${n})` : 'Follow-ups', viewDue]); }
  if (can('customers.view')) tabs.push(['loy', 'Loyalty', viewLoyalty]);

// ---------- new sale ----------

  root.replaceChildren(h('p', { class: 'muted' }, 'Loading…'));

      h('input', { 'data-k': 'q', type: 'search', placeholder: 'Search services…', value: S.q, oninput: (e) => { S.q = e.target.value; draw(); } }),

        h('span', {}, s.name), h('span', { class: 'p' }, money(s.price))))), !shown.length && h('p', { class: 'muted' }, 'No services match.'));

      rest.length && pref.length && h('option', { disabled: true }, '— other —'), ...rest.map(opt)];

  m = modal(body, h('div', { class: 'row noprint', style: 'margin-top:1rem' }, save, h('button', { onclick: () => window.print() }, 'Print'), h('button', { onclick: () => m.remove() }, 'Close')));

    const p = await api('GET', `/commissions/payslip?from=${from}&to=${to}&technicianId=${technicianId}${bq()}`);

    for (const x of p.lines) L.push(`${x.date} ${x.service}${x.collab ? ' (collabo 50%)' : ''}${x.reversal ? ' (voided sale)' : ''}`, `  ${x.base} @ ${x.rate == null ? 'fixed' : Math.round(x.rate * 10000) / 100 + '%'} = ${x.commission}`);
    if (!p.lines.length) L.push('No commission in this period.');
    L.push(bar, `Services: ${p.services}`, `Sales: ${k(p.sales)}`, `Materials: ${k(p.materials)}`, `Total commission: ${k(p.total)}`, `Already paid: ${k(p.paid)}`, `Balance due: ${k(p.balance)}`, `Pending ${k(p.pending)} · Approved ${k(p.approved)}`, '', 'Approved by: ____________', 'Received by: ____________');
    txt = L.join('\n');

}
